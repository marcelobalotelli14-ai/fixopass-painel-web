<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entrar — FIXO PASS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #10151b; --surface: #1a2129; --surface-2: #212b35; --border: #2e3944;
    --text: #ece8df; --text-dim: #8b96a1; --accent: #e3a23d; --accent-ink: #2a1d08;
    --deny: #c1554b; --radius: 10px;
    --font-display: 'Space Grotesk', sans-serif; --font-body: 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; }
  h1, h2, .display { font-family: var(--font-display); letter-spacing: -0.01em; }
  code, .mono { font-family: var(--font-mono); }
  a { color: var(--accent); }
  button {
    font-family: var(--font-body); font-weight: 600; cursor: pointer;
    border-radius: 6px; border: 1px solid transparent; padding: 10px 16px;
    font-size: 14px; transition: transform .08s ease, filter .15s ease;
  }
  button:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
  .btn-ghost:hover { background: var(--surface-2); }
  input {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 12px; border-radius: 6px; font-family: var(--font-body); font-size: 14px; width: 100%;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  label { font-size: 13px; color: var(--text-dim); display: block; margin-bottom: 6px; }
  .field { margin-bottom: 16px; }

  #auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .auth-card {
    width: 100%; max-width: 400px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 32px;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 8px; background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 700; color: var(--accent-ink); font-size: 15px;
  }
  .brand-name { font-size: 17px; font-weight: 600; }
  .auth-card h2 { margin: 0 0 4px; font-size: 22px; }
  .auth-card .sub { color: var(--text-dim); font-size: 14px; margin-bottom: 24px; }
  .switch-link { text-align: center; margin-top: 18px; font-size: 13px; color: var(--text-dim); }
  .switch-link a { cursor: pointer; }
  .error-banner {
    background: rgba(193, 85, 75, 0.12); border: 1px solid var(--deny); color: #ffb3ab;
    padding: 10px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; display: none;
  }
  .profile-toggle {
    display: flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px;
    padding: 4px; margin-bottom: 24px; gap: 4px;
  }
  .profile-toggle a {
    flex: 1; text-align: center; padding: 8px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
    color: var(--text-dim); transition: background .15s ease, color .15s ease;
  }
  .profile-toggle a.active { background: var(--accent); color: var(--accent-ink); }
  .profile-toggle a:not(.active):hover { color: var(--text); }
</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-mark">FP</div>
      <div class="brand-name">FIXO PASS</div>
    </div>

    <div class="profile-toggle">
      <a href="/app/login.html" class="active">Sou Cliente</a>
      <a href="/app">Sou Empresa</a>
    </div>

    <div id="error-banner" class="error-banner"></div>

    <!-- Login -->
    <div id="login-form">
      <h2>Entrar</h2>
      <div class="sub">Acesse sua conta para gerenciar seus dados e compartilhamentos.</div>
      <div class="field">
        <label>E-mail</label>
        <input type="email" id="login-email" placeholder="voce@email.com" />
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" id="login-senha" placeholder="••••••••" />
      </div>
      <button class="btn-primary" style="width:100%" onclick="doLogin()">Entrar</button>
      <div class="switch-link">Ainda não tem conta? <a href="/app/register-user.html">Criar conta</a></div>
    </div>
  </div>
</div>

<script>
const apiBase = 'https://fixopass-backend-production.up.railway.app';

function showError(msg) {
  const el = document.getElementById('error-banner');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideError() {
  document.getElementById('error-banner').style.display = 'none';
}

async function api(path, options = {}) {
  const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
  const userId = localStorage.getItem('fixopass_user_id');
  if (userId) headers['X-USER-ID'] = userId;
  const res = await fetch(apiBase + path, Object.assign({}, options, { headers }));
  let body = null;
  try { body = await res.json(); } catch (e) { /* pode ser vazio */ }
  if (!res.ok) {
    throw new Error((body && body.error) || `Erro ${res.status}`);
  }
  return body;
}

async function doLogin() {
  hideError();
  const email = document.getElementById('login-email').value.trim();
  const senha = document.getElementById('login-senha').value;

  if (!email || !senha) {
    showError('Preencha e-mail e senha.');
    return;
  }

  try {
    const data = await api('/users/login', { method: 'POST', body: JSON.stringify({ email, senha }) });
    localStorage.setItem('fixopass_user_id', data.userId);
    localStorage.setItem('fixopass_user_nome', data.nomeCompleto || '');
    localStorage.setItem('fixopass_user_email', email);
    location.href = '/app/user-dashboard.html';
  } catch (e) {
    showError(e.message);
  }
}

// ---------- Boot ----------
// Já logado? Direto pro painel — sem tela de espera no meio do caminho.
if (localStorage.getItem('fixopass_user_id')) {
  location.href = '/app/user-dashboard.html';
}
</script>
</body>
</html>
